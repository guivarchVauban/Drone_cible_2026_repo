services:
  ros2_camera:
    build: .
    container_name: ros2_camera
    restart: always
    network_mode: host
    privileged: true
    group_add:
      - video
    devices:
      - /dev/video0:/dev/video0
    environment:
      - ROS_DOMAIN_ID=52
    volumes:
      - "/home/util/ProjetDrone/m_verrou/ros_ws:/root/ros_ws"
      - /tmp/.X11-unix:/tmp/.X11-unix
    tty: true
