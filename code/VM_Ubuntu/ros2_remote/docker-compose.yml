services:
  ros2_remote:
    build: .
    container_name: ros2_remote
    network_mode: host
    privileged: true
    volumes:
      - "/home/util/Documents/Projet/ros2_remote/ros_ws:/root/ros_ws"
    environment:
      - ROS_DOMAIN_ID=52
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    tty: true
    command: |
      bash -c '
        source /opt/ros/humble/setup.bash

        ros2 run joy joy_node &
       '
#        ros2 run teleop_twist_joy teleop_node \
#          --ros-args \
#          --params-file /root/ros_ws/config/teleop_joy.yaml
#      '
