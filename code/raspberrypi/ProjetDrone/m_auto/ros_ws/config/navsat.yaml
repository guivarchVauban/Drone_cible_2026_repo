navsat_transform_node:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: -0.0349  # -2° pour la Bretagne
    yaw_offset: 1.5707963                  # IMU lit 0 face au nord → offset pi/2
    zero_altitude: true                    # altitude GPS peu fiable (-70m chez toi)
    broadcast_utm_transform: true
    publish_filtered_gps: true             # publie /Nav_sat_fix_transformed
    use_odometry_yaw: false
    wait_for_datum: false
